name: shipit-release

# mkdocs-lex's shipit release caller (ADP02-WS09 — the fleet's first consumer
# pypi live fire), the BLESSED per-stage dispatch shape (ADR-0054,
# workflows.lex §8) inherited verbatim from shipit's own caller (shipit#806):
# one workflow_dispatch caller with a `stage` choice (full | prepare | build |
# sign | publish), one job per stage, each a single `uses:` line against the
# matching block, gated `if: inputs.stage == '...'`, forwarding
# `version`/`tag`/`run-id`/`unsigned` verbatim. Routing ONLY (ADR-0040): the
# release plan — matrix, live stages, the post-RC-guard endpoint set, required
# secrets — is preflight's, computed inside the blocks from `.shipit.toml`
# `[artifacts.mkdocs-lex-plugin]`; nothing is re-derived or wired
# stage-to-stage here.
#
# Every ref is the FULL remote `arthur-debert/shipit/...@v1` form — the
# remote-ref scar (legacy release RC shipit#823): a `./` reusable-workflow ref
# resolves against the top-level caller's repo, which here would look for the
# blocks in mkdocs-lex itself. The remote form is correct-by-construction (and
# rides the same advance-major-moved `v1` the fleet rides, ADR-0010).
#
# This repo's release surface is the pure-python wheel + sdist
# (`[artifacts.mkdocs-lex-plugin]`: whole-leg `uv build`, no platforms — one
# default-platform build job), distributed to gh-release + pypi. The plan
# carries no sign stage (nothing darwin to sign), so a `sign` dispatch is a
# plan-proven no-op that skips; the choice stays offered because this caller
# inherits the blessed shape whole, never a trimmed variant.
#
# Secrets — exactly the plan-required set for this repo's plan:
#   RELEASE_TOKEN  prepare's tag+branch push through the ruleset (a
#                  GITHUB_TOKEN push would not re-trigger workflows, so the
#                  tag push could never fire the tag-triggered stages).
#   PYPI_TOKEN     the pypi endpoint's twine upload (shipit
#                  secretreq.ENDPOINT_SECRETS["pypi"]), forwarded to the
#                  publish-carrying dispatches (`full`, `publish`). On an rc
#                  version the central registry RC guard drops the pypi
#                  endpoint, so the rc proof rides gh-release alone.
# gh-release rides the workflow's own GITHUB_TOKEN (no registry entry). The
# legacy PYPI_PASSWORD secret is NOT forwarded — legacy-only, untouched. The
# legacy release.yml caller stays alongside until the rc proof lands
# (removal is a recorded follow-up, not this diff).

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The release version, consumed by `full`/`prepare`: a bare semver
          (0.3.0, 0.3.0-release-rc) or a bump word (major|minor|patch).
          Ignored by the tag-dispatched stages.
        required: false
        type: string
      stage:
        description: >-
          What to dispatch: the full composed chain (default) or ONE
          independently re-runnable stage block (per-stage dispatch,
          ADR-0054). `prepare` dispatches on `version`; `build`, `sign`
          and `publish` on `tag` (+ `run-id` for the artifact-consuming
          stages).
        required: false
        type: choice
        default: full
        options:
          - full
          - prepare
          - build
          - sign
          - publish
      tag:
        description: >-
          The release tag (v<version>), consumed by the `build`/`sign`/
          `publish` stage dispatches (ADR-0041: the version is read off
          the tag). Ignored by `full`/`prepare`.
        required: false
        type: string
      run-id:
        description: >-
          The SOURCE run id whose artifacts feed an artifact-consuming
          stage dispatch (`sign`, `publish`) — one source run per dispatch
          (workflows.lex §8). Ignored by the other stages.
        required: false
        type: string
      unsigned:
        description: >-
          Break-glass: flip a signing plan to the unsigned path. Forwarded
          verbatim; this repo's plan has no sign stage, so preflight refuses
          it here — offered because this caller inherits the blessed shape.
        required: false
        type: boolean
        default: false

# The standalone dispatch caller's grant (workflows.lex §8): `contents:
# write` for prepare's push and publish's gh-release, `actions: read` for
# the cross-run artifact downloads (`run-id` flips download-artifact onto
# the REST API). The downloading blocks deliberately declare NO
# `permissions:` key — a called workflow can only downgrade this token.
permissions:
  contents: write
  actions: read

jobs:
  release:
    if: inputs.stage == 'full'
    uses: arthur-debert/shipit/.github/workflows/wf-release.yml@v1
    with:
      version: ${{ inputs.version }}
      unsigned: ${{ inputs.unsigned }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  prepare:
    if: inputs.stage == 'prepare'
    uses: arthur-debert/shipit/.github/workflows/wf-prepare.yml@v1
    with:
      version: ${{ inputs.version }}
      unsigned: ${{ inputs.unsigned }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  build:
    if: inputs.stage == 'build'
    uses: arthur-debert/shipit/.github/workflows/wf-build.yml@v1
    with:
      tag: ${{ inputs.tag }}

  sign:
    if: inputs.stage == 'sign'
    uses: arthur-debert/shipit/.github/workflows/wf-sign-mac.yml@v1
    with:
      tag: ${{ inputs.tag }}
      run-id: ${{ inputs.run-id }}

  publish:
    if: inputs.stage == 'publish'
    uses: arthur-debert/shipit/.github/workflows/wf-publish.yml@v1
    with:
      tag: ${{ inputs.tag }}
      run-id: ${{ inputs.run-id }}
      unsigned: ${{ inputs.unsigned }}
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
