name: Release

# Thin caller of arthur-debert/release/.github/workflows/python-pkg.yml@v1.
# All the build + publish + GH-release logic lives there; this file is just
# the binding (inputs, secrets) and the workflow_dispatch trigger.
#
# Replaces the prior hand-rolled pypi-publish.yml (Python build + twine
# + softprops/action-gh-release). The canonical workflow uses uv build +
# uv publish, awk-based pyproject [project].version bump, preflight secret
# validation, and a release job gated on the publish jobs (no partial-
# release window).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.3.0 or 1.0.0-rc.1). No leading v.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: arthur-debert/release/.github/workflows/python-pkg.yml@v1
    with:
      version: ${{ inputs.version }}
      # No CHANGELOG.md in this repo yet — empty path skips changelog
      # roll + extract and emits a default release note. Drop this once
      # a Keep-a-Changelog CHANGELOG.md lands.
      changelog-path: ''
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
