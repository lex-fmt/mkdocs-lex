name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 0.1.0). Leave blank to use the version in pyproject.toml."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine tomli

      - name: Determine version
        id: determine_version
        shell: bash
        run: |
          set -euo pipefail
          input_version="${{ inputs.release_version }}"
          if [ -n "${input_version}" ]; then
            release_version="${input_version}"
          else
            release_version=$(python -c "import tomli, sys; print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${release_version}" >> "$GITHUB_OUTPUT"

      - name: Sync pyproject.toml version
        id: sync_version
        shell: bash
        run: |
          set -euo pipefail
          target="${{ steps.determine_version.outputs.release_version }}"
          current=$(python -c "import tomli; print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${current}" != "${target}" ]; then
            python - <<PY
          import re, pathlib
          p = pathlib.Path("pyproject.toml")
          text = p.read_text()
          new = re.sub(r'^version\s*=\s*".*"', f'version = "${target}"', text, count=1, flags=re.M)
          p.write_text(new)
          PY
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit version bump
        if: steps.sync_version.outputs.version_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.determine_version.outputs.release_version }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ steps.determine_version.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
