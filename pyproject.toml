[project]
name = "mkdocs-lex-plugin"
version = "0.1.0"
description = "A native Lex parser and integration for MkDocs."
dependencies = [
    "mkdocs>=1.0",
    # You don't necessarily need to list 'lexd' if it's a Rust binary, 
    # but you should document that it's required in the README.
]

[project.optional-dependencies]
dev = ["pytest"]

[project.entry-points."mkdocs.plugins"]
lex = "mkdocs_lex.plugin:LexPlugin"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mkdocs_lex"]
