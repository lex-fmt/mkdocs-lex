# pixi workspace — seeded by `shipit install` (the managed blocks below
# need a valid manifest). Consumer-owned from here on: edit freely.
[workspace]
name = "lex-fmt_mkdocs-lex"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[tasks]
# >>> shipit-managed test task (do not edit; regenerate via `shipit install`) >>>
test = "./bin/shipit test"
# <<< shipit-managed test task <<<
# >>> shipit-managed tasks (do not edit; regenerate via `shipit install`) >>>
changelog = "./bin/shipit changelog"
lint = "./bin/shipit lint"
logs = "./bin/shipit logs"
provision-lexd = "./bin/shipit provision lexd"
# <<< shipit-managed tasks <<<

[feature.lint.dependencies]
# >>> shipit-managed lint deps (do not edit; regenerate via `shipit install`) >>>
# The fleet-pinned lint toolchain (docs/prd/adoption.md: the managed set owns
# the consumer environment). Canonical versions live HERE — a bump is one data
# edit, rolled fleet-wide on each consumer's next `shipit install` reconcile.
ruff = "0.15.*"
# shellcheck is PINNED DOWN to 0.10.* (not 0.11): shellcheck 0.11.0 has an SC2218
# reaching-definitions false positive — a call to an EARLIER-defined function is
# flagged "defined later" when a subshell (`$(...)`, a pipeline component, `<(...)`)
# sits near the call, reddening the hermetic gate on CORRECT code across 5+ fleet
# repos. 0.11.0 is the latest upstream (no fixed 0.11.x yet); restore 0.11+ when
# upstream fixes it.
shellcheck = "0.10.*"
# conda-forge name for the `shfmt` binary
go-shfmt = "3.*"
yamllint = "1.38.*"
prettier = "3.8.*"
markdownlint-cli = "0.49.*"
# GitHub Actions workflow gate — the actions Lang of `shipit lint` (TOL01-WS04)
actionlint = "1.7.*"
lefthook = "2.1.*"
# <<< shipit-managed lint deps <<<

[environments]
# The default env pulls in the consumer-owned `test` feature (deps below) so
# `pixi run test` is hermetic. It is scoped to `test` — NOT the default feature —
# so it does NOT leak into the shipit-managed `lint` env that the pre-commit/
# pre-push hooks run (`pixi run -e lint lint`), keeping that hook env lean.
default = ["test"]
# >>> shipit-managed environments (do not edit; regenerate via `shipit install`) >>>
lint = ["lint"]
# <<< shipit-managed environments <<<

# Consumer-owned dependencies (outside the shipit-managed blocks above).
# Scoped to a dedicated `test` feature (pulled into the default env above), NOT
# pixi's implicit default feature: top-level [dependencies]/[pypi-dependencies]
# would apply to EVERY environment — including `lint` — bloating the hook env
# with the editable project + mkdocs/pytest. Scoping keeps `lint` lean while the
# default test run stays hermetic.
#
# The `test` feature self-installs THIS package editable: the integration test
# (tests/test_integration.py) shells out to `mkdocs build`, which resolves the
# `lex` plugin via this package's `mkdocs.plugins` entry point — so the package
# must be INSTALLED in the env that runs the suite, not merely present on disk.
# CI provisions the same set by hand (`pip install -e ".[dev]" mkdocs`); pinning
# it here makes the hermetic pixi env match. The `dev` extra carries pytest, and
# the editable install pulls the `mkdocs>=1.0` runtime dep declared in
# pyproject.toml. python is pinned to CI's 3.11 (.github/workflows/python-unittests.yml).
[feature.test.dependencies]
python = "3.11.*"

[feature.test.pypi-dependencies]
mkdocs-lex-plugin = { path = ".", editable = true, extras = ["dev"] }
